<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WhatsAI — Voice</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="call">
    <div class="call-top">
      <img class="avatar ring" src="../avatars/jules.jpg" width="128" height="128" alt="" />
      <h2>Jules Okonkwo</h2>
      <p>Speaking…</p>
    </div>
    <div>
      <p style="text-align:center;color:var(--text-sec);font-size:12px;margin-bottom:10px">Tap to talk to someone else</p>
      <div class="switchers">
        <figure>
          <img class="avatar" src="../avatars/mira.jpg" width="52" height="52" alt="" />
          <span>Mira</span>
        </figure>
        <figure>
          <img class="avatar" src="../avatars/elena.jpg" width="52" height="52" alt="" />
          <span>Elena</span>
        </figure>
        <figure>
          <img class="avatar" src="../avatars/kai.jpg" width="52" height="52" alt="" />
          <span>Kai</span>
        </figure>
      </div>
    </div>
    <div class="controls">
      <div class="ctrl">
        <svg class="icon" viewBox="0 0 24 24" style="width:26px;height:26px"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/></svg>
      </div>
      <div class="ctrl end">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M22 16.92V21a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 5.18 2 2 0 0 1 4.11 3h4.09a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L9.09 10.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      </div>
    </div>
  </div>
</body>
</html>
