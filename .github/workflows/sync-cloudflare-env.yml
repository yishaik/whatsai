name: Sync Cloudflare env to Vercel

# Copies AI provider GitHub secrets onto the Vercel project. Safe to re-run.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      VOICE_AGENT_HOST: ${{ secrets.VOICE_AGENT_HOST }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      OPEN_CONNECTOR_URL: ${{ secrets.OPEN_CONNECTOR_URL }}
      OPEN_CONNECTOR_TOKEN: ${{ secrets.OPEN_CONNECTOR_TOKEN }}
      OPEN_CONNECTOR_TELEGRAM_CHAT_ID: ${{ secrets.OPEN_CONNECTOR_TELEGRAM_CHAT_ID }}
    steps:
      - name: Upsert Vercel env vars
        run: |
          python3 <<'PY'
          import json, os, urllib.request
          token = os.environ['VERCEL_TOKEN']
          project = os.environ['VERCEL_PROJECT_ID']
          org = os.environ.get('VERCEL_ORG_ID', '')
          url = f'https://api.vercel.com/v10/projects/{project}/env?upsert=true'
          if org:
              url += f'&teamId={org}'
          def upsert(key, val):
              if not val:
                  print(f'Skipping {key} (secret not set)')
                  return
              print(f'Upserting {key} (production, preview, development)')
              body = json.dumps({
                  'key': key,
                  'value': val,
                  'type': 'encrypted',
                  'target': ['production', 'preview', 'development'],
              }).encode()
              req = urllib.request.Request(url, data=body, method='POST', headers={
                  'Authorization': f'Bearer {token}',
                  'Content-Type': 'application/json',
              })
              with urllib.request.urlopen(req) as resp:
                  data = json.load(resp)
              out = {
                  'created': bool(data.get('created')),
                  'key': data.get('key'),
                  'target': data.get('target'),
                  'error': data.get('error'),
                  'message': data.get('message'),
              }
              print(json.dumps(out))
          for k in ['CLOUDFLARE_ACCOUNT_ID','CLOUDFLARE_API_TOKEN','GROQ_API_KEY','CEREBRAS_API_KEY','OPENROUTER_API_KEY','NVIDIA_API_KEY','VOICE_AGENT_HOST','GEMINI_API_KEY','OPENAI_API_KEY','XAI_API_KEY','OPEN_CONNECTOR_URL','OPEN_CONNECTOR_TOKEN','OPEN_CONNECTOR_TELEGRAM_CHAT_ID']:
              upsert(k, os.environ.get(k, ''))
          PY
