name: CI

# Same checks as `npm run verify` locally. Run this before pushing to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        # Vite inlines VITE_* at build time. Production gets the real URL from
        # `vercel pull`; CI only needs a syntactically valid value so the bundle
        # compiles the same way.
        run: npm run build
        env:
          VITE_CONVEX_URL: https://ci-placeholder.convex.cloud
